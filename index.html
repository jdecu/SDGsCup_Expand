<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDGs Cup – Expand Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F6F3;--card:#fff;--ink:#111;--mute:#5A6B61;--line:#D8E5DD;--gold:#008A5E;--dark:#0A5C1A;--onacc:#fff;--green:#008A5E}
@media(prefers-color-scheme:dark){:root{--bg:#0B1612;--card:#12231B;--ink:#EAF3ED;--mute:#9DB5A8;--line:#24392E;--gold:#22B880;--onacc:#04150D}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',sans-serif;margin:0}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:3px solid var(--gold);position:sticky;top:0;background:var(--bg);z-index:5}
header .logo{height:38px;width:auto;display:block}
header b{font-family:'Bricolage Grotesque';font-size:1.15rem;display:block}header small{color:var(--mute)}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.hero{background:var(--dark);color:#fff;border:0}
.hero .big{font-family:'Bricolage Grotesque';font-weight:800;font-size:3.4rem;line-height:1;color:#9BE8C6}
.hero p{margin:8px 0 0;opacity:.85}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.mute{color:var(--mute);font-size:.88rem}
.sdg{min-width:34px;height:34px;border-radius:8px;background:var(--green);color:var(--onacc);font:800 .95rem 'Bricolage Grotesque';display:grid;place-items:center}
.tag{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1.5px solid currentColor}

.pts{font:800 1.1rem 'Bricolage Grotesque';white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 -4px 18px #0000000d}
nav>div{display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;max-width:640px;margin:0 auto}
nav .tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mute);font:600 .72rem 'DM Sans',sans-serif;padding:2px 0;cursor:pointer;min-width:0}
nav .tab svg{display:block;box-sizing:content-box;width:22px;height:22px;padding:5px 16px;border-radius:99px;transition:background .15s}
nav .tab.on{color:var(--gold);font-weight:700}
nav .tab.on svg{background:color-mix(in srgb,var(--gold) 16%,transparent)}
nav .fab{justify-self:center;display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--gold);color:var(--onacc);font:400 2.2rem/1 'DM Sans',sans-serif;border:0;padding:0 0 3px;margin-top:-34px;cursor:pointer;box-shadow:0 0 0 6px var(--card),0 8px 18px #00000033}
nav .fab:active{transform:scale(.95)}
.wk{display:flex;gap:8px;overflow-x:auto}
.wk button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 18px;font:700 .95rem 'DM Sans',sans-serif;cursor:pointer}
.wk button.on{background:var(--gold);border-color:var(--gold);color:var(--onacc)}
.help-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font:800 1rem 'DM Sans',sans-serif;color:var(--ink);cursor:pointer}
.tour-layer{position:fixed;inset:0;z-index:90}
.tour-block{position:fixed;inset:0}
.tour-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(8,25,16,.7);transition:all .25s;pointer-events:none;outline:3px solid var(--gold);outline-offset:2px}
.tour-hole.none{outline:0;width:0!important;height:0!important;left:50%!important;top:50%!important}
.tour-card{position:fixed;background:var(--card);color:var(--ink);border-radius:20px;width:min(340px,calc(100vw - 24px));padding:18px;box-shadow:0 20px 50px #0006}
.tour-card .tc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tour-card .skip{border:0;background:none;color:var(--mute);font:600 .85rem 'DM Sans',sans-serif;cursor:pointer}
.tour-card h3{font-size:1.3rem;margin:2px 0 8px}
.tour-card p{margin:0 0 8px;line-height:1.5}
.tour-card .tdots{display:flex;gap:5px;margin:10px 0 12px}
.tour-card .tdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tour-card .tdots i.on{background:var(--gold);width:18px;border-radius:99px}
.note{background:color-mix(in srgb,var(--gold) 12%,var(--card));border-radius:12px;padding:10px 14px;font-size:.88rem;line-height:1.45;margin:10px 0 6px}
.lv{font:700 .72rem 'DM Sans',sans-serif;padding:2px 9px;border-radius:99px;white-space:nowrap}
.lv.easy{background:#DDF3E8;color:#0A6B45}.lv.medium{background:#FFF0CC;color:#8A5A00}.lv.hard{background:#FBDDE1;color:#9B1C2E}
.hl{display:grid;gap:8px;margin-top:12px}
.hi{display:flex;gap:10px;align-items:flex-start;background:#ffffff1c;border-radius:12px;padding:10px 12px}
.hi span{flex:1;font-size:.92rem;line-height:1.35}.hi b{white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 .8rem 'DM Sans',sans-serif;flex:none}
.auto{margin:6px 0;color:var(--mute);font-size:.9rem;font-style:italic}
.act{margin-top:10px;gap:8px}
.ab{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 14px;font:700 .88rem 'DM Sans',sans-serif;cursor:pointer}
.ab.on{color:#D32F4B;border-color:#D32F4B}
.cms{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.cm{margin-bottom:10px;font-size:.92rem}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.75rem;letter-spacing:.08em;color:var(--gold)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 50%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin:6px 0 10px}
.pod{text-align:center}.pod .av{margin:0 auto}
.pod .nm{font-weight:700;font-size:.85rem;margin:6px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{border-radius:14px 14px 6px 6px;padding-top:10px;display:flex;flex-direction:column;align-items:center}
.pb .rk{font:800 1.7rem 'Bricolage Grotesque',sans-serif;line-height:1}.pb .pp{font-weight:700;font-size:.85rem;margin-top:4px}
.lb{display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line)}
.lb.me{background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:12px}
.lb .pos{width:24px;font-size:1.1rem}
button.p{background:var(--gold);color:var(--onacc);border:0;border-radius:10px;padding:10px 16px;font:700 .95rem 'DM Sans';cursor:pointer}
button.g{background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 .85rem 'DM Sans';cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0 12px}
label{font-weight:700;font-size:.88rem}
dialog{border:0;border-radius:18px;padding:22px;width:min(92vw,440px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.rank{display:flex;align-items:center;gap:12px}
.pos{font:800 1.6rem 'Bricolage Grotesque';width:34px;text-align:center}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px}.dot.live{background:#2ECC71}
</style>
</head>
<body>
<header>
  <div class="row"><img src="logo.png" alt="Expand Consulting" class="logo" onerror="this.remove()"><div><b>SDGs Cup</b><small>Expand Consulting</small></div></div>
  <div class="row"><span class="mute" id="status" style="white-space:nowrap"></span><button class="help-btn" id="help" aria-label="Aide : refaire le tour" title="Refaire le tour">?</button></div>
</header>
<main id="app"></main>
<nav><div>
  <button class="tab" data-t="feed"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg><span>Feed</span></button>
  <button class="tab" data-t="rank"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg><span>Classement</span></button>
  <button class="fab" id="add" aria-label="Déclarer un défi">+</button>
  <button class="tab" data-t="chal"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>Défis</span></button>
  <button class="tab" data-t="me"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Mon profil</span></button>
</div></nav>
<dialog id="dlg"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============ CONFIGURATION (à modifier) ============ */
const PTS = {easy:5, medium:10, hard:15};   // points par niveau
const TEAM_COLORS = ["#008A5E","#0A5C1A","#222222","#2FA37A","#4C9A2A","#1E6F5C","#6B8E23"];   // verts Expand + noir
/* c(id, n° ODD, niveau, texte, {rep:répétable, unit:"2 €" pour des points par tranche, pts:points spéciaux}) */
const c = (id,sdg,lvl,t,o={}) => ({id,sdg,lvl,t,rep:!!o.rep,unit:o.unit||"",pts:o.pts ?? PTS[lvl]});
const CONFIG = {
  start: "2027-02-01",                 // date de lancement
  adminPin: "1234",                    // PIN pour supprimer des posts (à changer !)
  weeks: ["S1","S2","S3","S4","S5","S6","S7","S8","S9","S10","S11"],     // chaque semaine s'ouvre 7 jours après la précédente, à partir de "start"
  /* Semaine par ODD (à adapter !). Pour un défi précis, ajoute w:"S2" dans sa ligne. */
  weekOfOdd: {1:"S1",2:"S1",3:"S1",4:"S1",7:"S2",8:"S2",10:"S2",11:"S2",12:"S3",13:"S3",14:"S3",15:"S3",16:"S4",17:"S4"},
  teams: ["CxO", "HR", "CU", "SSU", "STU", "QU", "CommU"],
  teamPins: {                          // PIN de chaque département (à changer !)
    CxO: "5678", HR: "9012", CU: "3456", SSU: "7890", STU: "2345", QU: "6789", CommU: "0123"
  },
  /* Chaque semaine : 3 faciles (5 pts), 3 moyens (10 pts), 3 difficiles (15 pts), tous faisables en une semaine */
  challenges: [
    // ---- S1 : ODD 1, 2, 3, 4 ----
    c("s1e1",3,"easy","Bouge : 10 000 pas ou 30 min d'activité physique dans la journée (idéalement avec Expand, canal #sport)"),
    c("s1e2",3,"easy","Gratitude : note 3 choses positives chaque jour pendant la semaine"),
    c("s1e3",2,"easy","Courses de saison : fais tes courses chez färm ou dans un magasin durable, avec des produits de saison"),
    c("s1m1",1,"medium","Grand tri : donne des vêtements ou des objets inutilisés à une association"),
    c("s1m2",3,"medium","Cuisine maison : prépare tes repas toi-même pendant la semaine, en privilégiant des aliments sains"),
    c("s1m3",4,"medium","Coworking ou monitorat : organise une demi-journée pour vous entraider (inscription via l'Excel)"),
    c("s1h1",2,"hard","Repas solidaire : prépare un repas maison et donne-le à une personne sans-abri"),
    c("s1h2",3,"hard","Donne ton sang avant la fin de la semaine"),
    c("s1h3",4,"hard","Table de discussion : organise un débat sur un sujet de ton choix"),
    // ---- S2 : ODD 7, 8, 10, 11 ----
    c("s2e1",7,"easy","Tri numérique : fais le ménage dans tes photos, mails, apps et spams"),
    c("s2e2",7,"easy","Trajet doux : un trajet en bus, train, vélo ou roller au lieu de la voiture",{rep:true}),
    c("s2e3",8,"easy","Networking : échange avec 3 nouvelles personnes"),
    c("s2m1",7,"medium","Défi énergie : chargeurs débranchés, lumières éteintes, moins d'1 h de téléphone par jour"),
    c("s2m2",8,"medium","Achats éthiques : +1 pt par 2 € dépensés dans un magasin local, durable ou éthique",{rep:true,unit:"2 €",pts:1}),
    c("s2m3",10,"medium","Ouverture : demande son avis à quelqu'un de différent et écoute sans contredire (ou défends une personne en situation de minorité)"),
    c("s2h1",10,"hard","Participe à un event KAP solidaire ou inclusif, à un atelier de la Maison du DD ou à une conférence JCL"),
    c("s2h2",11,"hard","Zéro voiture pendant 1 semaine"),
    c("s2h3",11,"hard","Rends service : propose un covoiturage ou aide une personne à mobilité réduite à se déplacer"),
    // ---- S3 : ODD 12, 13, 14, 15 ----
    c("s3e1",13,"easy","Passe ton navigateur sur Ecosia et écris 2 éco-résolutions pour l'année"),
    c("s3e2",12,"easy","Explique le développement durable à un pote (mini speech)"),
    c("s3e3",12,"easy","Évite les fastfoods : mange au RestU ou prépare ton lunch"),
    c("s3m1",12,"medium","Répare quelque chose au lieu de le remplacer"),
    c("s3m2",12,"medium","Une journée sans plastique : lunch en contenant réutilisable, gourde, rien d'emballé dans du plastique"),
    c("s3m3",14,"medium","Évite les produits de la mer pendant la semaine"),
    c("s3h1",13,"hard","Semaine végé : que des repas végétariens, de préférence bio, locaux ou en vrac"),
    c("s3h2",12,"hard","Zéro déchet : max une poubelle de 30 L dans le kot sur la semaine, sans gaspillage alimentaire"),
    c("s3h3",15,"hard","Ramassage de déchets autour du lac ou du parc de la Source (photo à l'appui)")
  ],
  /* Mode temps réel : colle ici ta config Firebase (Realtime Database).
     Laisse null pour tester en mode démo (stockage local, non partagé). */
  firebase: {
    apiKey: "AIzaSyBvkg51z7zWS3vmMrQ9xLPsIh1dhhYQeKs",
    authDomain: "sdgs-cup-expand.firebaseapp.com",
    databaseURL: "https://sdgs-cup-expand-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "sdgs-cup-expand",
    appId: "1:479092995283:web:dd800456d13b2dc5b4d026"
  }
  /* ex: { apiKey:"...", authDomain:"...", databaseURL:"https://xxx-default-rtdb.europe-west1.firebasedatabase.app", projectId:"..." } */
};

/* ============ COUCHE DONNÉES ============ */
const Store = (() => {
  if (CONFIG.firebase) {
    firebase.initializeApp(CONFIG.firebase);
    const R = p => firebase.database().ref(p);
    return {
      live: true,
      sub(cb){ R("posts").on("value", s => { const v = s.val() || {}; cb(Object.entries(v).map(([id,p]) => ({...p, id})).sort((a,b)=>b.ts-a.ts)); }); },
      add(p){ return R("posts").push(p); },
      del(id){ R("likes/"+id).remove(); R("comments/"+id).remove(); return R("posts/"+id).remove(); },
      subW(cb){ R("settings/weeks").on("value", s => cb(s.val() || {})); },
      subC(cb){ R("settings/current").on("value", s => cb(s.val() || "")); },
      setC(v){ return R("settings/current").set(v || null); },
      setW(w, v){ return R("settings/weeks/"+w).set(v); },
      subL(cb){ R("likes").on("value", s => cb(s.val() || {})); },
      setLike(pid, k, on){ return R("likes/"+pid+"/"+k).set(on ? true : null); },
      subM(cb){ R("comments").on("value", s => cb(s.val() || {})); },
      addCm(pid, c){ return R("comments/"+pid).push(c); },
      delCm(pid, id){ return R("comments/"+pid+"/"+id).remove(); }
    };
  }
  const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const rd = { p: () => get("sdgcup_posts", []).sort((a,b)=>b.ts-a.ts), w: () => get("sdgcup_weeks", {}), c: () => get("sdgcup_cur2", ""), l: () => get("sdgcup_likes", {}), m: () => get("sdgcup_comments", {}) };
  const cbs = {}, fire = k => cbs[k] && cbs[k](rd[k]()), sub = k => f => { cbs[k] = f; f(rd[k]()); };
  addEventListener("storage", () => Object.keys(rd).forEach(fire));
  return {
    live: false,
    sub: sub("p"), subW: sub("w"), subC: sub("c"), subL: sub("l"), subM: sub("m"),
    add(p){ const a = get("sdgcup_posts", []); a.push({...p, id: "p" + Date.now()}); put("sdgcup_posts", a); fire("p"); },
    del(id){ put("sdgcup_posts", get("sdgcup_posts", []).filter(p => p.id !== id)); fire("p"); },
    setC(v){ put("sdgcup_cur2", v || ""); fire("c"); },
    setW(w, v){ const o = get("sdgcup_weeks", {}); if (v === null) delete o[w]; else o[w] = v; put("sdgcup_weeks", o); fire("w"); },
    setLike(pid, k, on){ const o = get("sdgcup_likes", {}); o[pid] = o[pid] || {}; if (on) o[pid][k] = true; else delete o[pid][k]; put("sdgcup_likes", o); fire("l"); },
    addCm(pid, c){ const o = get("sdgcup_comments", {}); o[pid] = o[pid] || {}; o[pid]["c" + Date.now()] = c; put("sdgcup_comments", o); fire("m"); },
    delCm(pid, id){ const o = get("sdgcup_comments", {}); if (o[pid]) delete o[pid][id]; put("sdgcup_comments", o); fire("m"); }
  };
})();

/* ============ ÉTAT ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ODD = {1:"Pas de pauvreté",2:"Faim zéro",3:"Bonne santé et bien-être",4:"Éducation de qualité",5:"Égalité entre les sexes",6:"Eau propre et assainissement",7:"Énergie propre et d'un coût abordable",8:"Travail décent et croissance économique",9:"Industrie, innovation et infrastructure",10:"Inégalités réduites",11:"Villes et communautés durables",12:"Consommation et production responsables",13:"Lutte contre le changement climatique",14:"Vie aquatique",15:"Vie terrestre",16:"Paix, justice et institutions efficaces",17:"Partenariats pour la réalisation des objectifs"};
const LV = {easy:"Facile", medium:"Moyen", hard:"Difficile"}, LVO = {easy:1, medium:2, hard:3};
const ch = id => CONFIG.challenges.find(c => c.id === id);
const pts = p => { const x = ch(p.cid); return x ? x.pts * (x.unit ? Math.max(1, +p.qty || 1) : 1) : 0; };
const ptsLabel = x => "+" + x.pts + (x.unit ? " / " + x.unit : "");
const pill = l => `<span class="lv ${l}">${LV[l]}</span>`;
const teamColor = t => TEAM_COLORS[Math.max(0, CONFIG.teams.indexOf(t)) % TEAM_COLORS.length];
const ini = t => String(t).slice(0, 2).toUpperCase();
let posts = [], likes = {}, cms = {}, tab = "feed", admin = false, wsel = null, weeksOn = {}, curW = "";
const openCm = new Set();
let me = (() => { try { return JSON.parse(localStorage.getItem("sdgcup_me")) || {}; } catch { return {}; } })();
const saveMe = () => { try { localStorage.setItem("sdgcup_me", JSON.stringify(me)); } catch {} };
const verified = () => !!(me.name && me.team && me.verifiedTeam === me.team);
const uKey = () => (me.name + "|" + me.team).toLowerCase().replace(/[.#$\[\]\/]/g, "_");
const ago = t => { const m = Math.round((Date.now()-t)/60000); return m<1?"à l'instant":m<60?`il y a ${m} min`:m<1440?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`; };
const scores = () => CONFIG.teams.map(t => ({ t, p: posts.filter(x => x.team === t).reduce((s,x) => s + pts(x), 0), n: posts.filter(x => x.team === t).length })).sort((a,b) => b.p - a.p);
const sdText = () => new Date(CONFIG.start + "T12:00:00").toLocaleDateString("fr-BE", {day:"numeric", month:"long", year:"numeric"});

/* ---- semaines : ouverture automatique à partir de "start" ---- */
const weekIdx = w => CONFIG.weeks.indexOf(w);
const autoIdx = () => { const d = (Date.now() - new Date(CONFIG.start + "T00:00:00")) / 864e5; return d < 0 ? -1 : Math.min(Math.floor(d / 7), CONFIG.weeks.length - 1); };
const refIdx = () => curW === "none" ? -1 : curW ? weekIdx(curW) : autoIdx();   // "" = automatique, "none" = pas encore commencé
const effCur = () => CONFIG.weeks[refIdx()] || "";
const wkVisible = w => weeksOn[w] === true ? true : weeksOn[w] === false ? false : weekIdx(w) >= 0 && weekIdx(w) <= refIdx();
const wkOf = x => x.w || CONFIG.weekOfOdd[x.sdg];
const avail = () => CONFIG.challenges.filter(x => admin || wkVisible(wkOf(x)));
const weekList = w => CONFIG.challenges.filter(x => wkOf(x) === w).sort((a,b) => LVO[a.lvl] - LVO[b.lvl]);

/* ============ VUES ============ */
function postCard(p){
  const x = ch(p.cid), lk = Object.keys(likes[p.id] || {}), liked = verified() && lk.includes(uKey());
  const cm = Object.entries(cms[p.id] || {}).map(([id, v]) => ({id, ...v})).sort((a,b) => a.ts - b.ts), open = openCm.has(p.id);
  const auto = x ? `${p.member} a relevé le défi « ${x.t} » (${LV[x.lvl]} · ODD ${x.sdg}) et rapporte +${pts(p)} pts au département ${p.team}.` : `${p.member} a relevé un défi.`;
  return `<div class="card"><div class="row sp"><div class="row"><div class="av" style="background:${teamColor(p.team)}">${esc(ini(p.team))}</div><div><b>${esc(p.member)}</b> <span class="mute">· ${esc(p.team)}</span><div class="mute">${ago(p.ts)}</div></div></div><div class="pts">+${pts(p)}</div></div>
    <div class="row" style="margin:12px 0 2px;gap:8px;align-items:flex-start">${x ? pill(x.lvl) : ""}<b>${x ? esc(x.t) : "Défi supprimé"}</b></div>
    <p class="auto">${esc(auto)}</p>
    ${p.note ? `<p style="margin:6px 0">${esc(p.note)}</p>` : ""}
    ${/^https?:\/\//.test(p.link||"") ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">Voir la preuve</a>` : ""}
    <div class="act row"><button class="ab ${liked ? "on" : ""}" data-like="${esc(p.id)}" aria-label="J'aime">${liked ? "♥" : "♡"} ${lk.length}</button><button class="ab" data-cm="${esc(p.id)}" aria-label="Commentaires">💬 ${cm.length}</button>${admin ? `<button class="g" data-del="${esc(p.id)}">Supprimer</button>` : ""}</div>
    ${open ? `<div class="cms">${cm.map(v => `<div class="cm"><b>${esc(v.author)}</b> <span class="mute">· ${esc(v.team)} · ${ago(v.ts)}</span>${admin ? ` <button class="g" data-dcm="${esc(p.id)}" data-id="${esc(v.id)}">×</button>` : ""}<div>${esc(v.text)}</div></div>`).join("")}
      <div class="row"><input id="ci-${esc(p.id)}" maxlength="200" placeholder="Écrire un commentaire…" style="margin:0"><button class="p" data-csend="${esc(p.id)}">Envoyer</button></div></div>` : ""}</div>`;
}
function vFeed(){
  const cw = effCur(), l = cw ? weekList(cw) : [];
  const hero = cw
    ? `<div class="card hero"><div class="mute" style="color:#fff9">Cette semaine</div><div class="big">${esc(cw)}</div>
       ${l.length ? `<div class="hl">${l.map(x => `<div class="hi">${pill(x.lvl)}<span>${esc(x.t)}</span><b>${ptsLabel(x)}</b></div>`).join("")}</div>` : `<p>Les défis de cette semaine arrivent bientôt.</p>`}
       <button class="p" style="margin-top:12px;background:#fff;color:var(--dark)" data-go="chal">Voir tous les défis</button></div>`
    : `<div class="card hero"><div class="mute" style="color:#fff9">Bientôt</div><div class="big" style="font-size:2.2rem">Pas encore commencé</div>
       <p>${!curW && autoIdx() < 0 ? "Les défis démarrent le " + sdText() + "." : "Les défis seront dévoilés par les organisateurs."} Reste connecté !</p></div>`;
  const list = posts.length ? posts.map(postCard).join("")
    : `<div class="card" style="text-align:center"><h3>Rien pour l'instant</h3><p class="mute">Sois le premier département au classement : appuie sur +.</p></div>`;
  return hero + `<div class="row sp" style="margin:6px 4px 10px"><h2>Le feed</h2><span class="mute">${posts.length} post${posts.length>1?"s":""}</span></div>` + list;
}
function vRank(){
  const s = scores(), max = Math.max(1, s[0]?.p), H = [150, 118, 96];
  const bg = ["var(--gold)", "color-mix(in srgb,var(--ink) 12%,var(--card))", "color-mix(in srgb,var(--gold) 30%,var(--card))"];
  const pod = s[0] && s[0].p > 0 && s.length >= 3 ? `<div class="podium">${[1,0,2].map(i => { const x = s[i]; return `<div class="pod"><div class="av" style="background:${teamColor(x.t)};width:44px;height:44px;font-size:.95rem">${esc(ini(x.t))}</div><div class="nm">${esc(x.t)}</div><div class="pb" style="height:${H[i]}px;background:${bg[i]};color:${i === 0 ? "var(--onacc)" : "var(--ink)"}"><div class="rk">${i+1}</div><div class="pp">${x.p} pts</div></div></div>`; }).join("")}</div>` : "";
  return `<div class="row sp" style="margin:6px 4px 12px"><h2>Classement</h2><span class="live"><i></i>LIVE</span></div><div class="card" style="padding:14px">${pod}` +
    s.map((x,i) => `<div class="lb ${me.team === x.t ? "me" : ""}"><div class="pos">${i+1}</div><div class="av" style="background:${teamColor(x.t)}">${esc(ini(x.t))}</div>
      <div style="flex:1;min-width:0"><b>${esc(x.t)}</b><div class="mute">${x.n} post${x.n>1?"s":""}</div><div class="bar"><i style="width:${x.p/max*100}%;background:${teamColor(x.t)}"></i></div></div><div class="pts">${x.p}</div></div>`).join("") + `</div>`;
}
function vChal(){
  const W = CONFIG.weeks, shown = admin ? W : W.filter(wkVisible);
  const note = `<div class="note">Chaque membre qui relève un défi poste sa propre preuve : chaque post rapporte les points à tout le département. Les défis d'une semaine sont réalisables pendant cette semaine.</div>`;
  if (!shown.length) return `<h2 style="margin:6px 4px 10px">Défis de la semaine</h2>${note}<div class="card" style="margin-top:16px;text-align:center"><h3>Pas encore commencé</h3><p class="mute">${!curW && autoIdx() < 0 ? "Les défis démarrent le " + sdText() + "." : "Les défis seront dévoilés par les organisateurs."}</p></div>`;
  if (!shown.includes(wsel)) wsel = shown.includes(effCur()) ? effCur() : shown[shown.length - 1];
  const off = !wkVisible(wsel), ex = weeksOn[wsel];
  const list = weekList(wsel), odds = Object.keys(ODD).filter(n => list.some(x => x.sdg == n));
  const adminBar = admin ? `<div class="card row sp" style="margin-top:14px"><div><b>${off ? "Semaine masquée" : "Semaine visible"}</b><div class="mute">${ex === undefined ? "Automatique : selon la date de départ." : "Réglage manuel."}</div></div><div class="row"><button class="${off ? "p" : "g"}" data-wt>${off ? "Afficher" : "Masquer"}</button>${ex === undefined ? "" : `<button class="g" data-wauto>Auto</button>`}</div></div>` : "";
  return `<h2 style="margin:6px 4px 10px">Défis de la semaine</h2>
  <div class="wk">${shown.map(w => `<button data-w="${w}" class="${w === wsel ? "on" : ""}">${w}${wkVisible(w) ? "" : " 🔒"}</button>`).join("")}</div>
  <p class="mute" style="margin:4px 4px 0">${effCur() === wsel ? "Semaine en cours" : "&nbsp;"}</p>${note}${adminBar}` +
  (odds.length ? odds.map(n => `<div class="row" style="margin:22px 4px 8px"><div class="sdg">${n}</div><h3>${esc(ODD[n])}</h3></div>` +
    list.filter(x => x.sdg == n).map(x => `<div class="card row sp"><div style="flex:1"><div style="margin-bottom:6px">${pill(x.lvl)}</div>${esc(x.t)}${x.rep ? `<div class="mute">Répétable</div>` : ""}</div><div class="pts">${ptsLabel(x)}</div></div>`).join("")).join("")
   : `<div class="card" style="margin-top:16px;text-align:center"><h3>Pas encore de défi</h3><p class="mute">Les défis de ${wsel} seront bientôt annoncés.</p></div>`);
}
function vMe(){
  const mine = posts.filter(p => p.member === me.name && p.team === me.team);
  const pinRequired = !!me.team && me.team !== me.verifiedTeam;
  return `<h2 style="margin:6px 4px 12px">Mon profil</h2><div class="card">
    <label>Mon prénom</label><input id="mn" value="${esc(me.name||"")}" placeholder="Ex : Camille">
    <label>Mon département</label><select id="mt"><option value="">Choisir…</option>${CONFIG.teams.map(t=>`<option ${me.team===t?"selected":""}>${esc(t)}</option>`).join("")}</select>
    ${pinRequired ? `<label>PIN du département</label><input id="mtp" type="password" inputmode="numeric" autocomplete="off" placeholder="Code PIN du département">` : me.verifiedTeam ? `<p class="mute">Département vérifié : ${esc(me.verifiedTeam)}</p>` : ""}
    <button class="p" id="sv">Enregistrer</button></div>
    ${me.name?`<div class="card"><b>${mine.length} défi${mine.length>1?"s":""} validé${mine.length>1?"s":""}</b> · ${mine.reduce((s,p)=>s+pts(p),0)} pts</div>`:""}
    <div class="card"><label>Mode organisateur</label>${admin?`<p class="mute">Activé : tu peux supprimer des posts et des commentaires depuis le feed.</p><label>Semaine en cours</label><select id="wcur"><option value="" ${!curW ? "selected" : ""}>Automatique (selon la date de départ)</option><option value="none" ${curW === "none" ? "selected" : ""}>Pas encore commencé</option>${CONFIG.weeks.map(w => `<option ${curW === w ? "selected" : ""}>${w}</option>`).join("")}</select><p class="mute">Automatique : chaque semaine s'ouvre toute seule, 7 jours après la précédente, à partir du ${sdText()}. Choisis une semaine pour forcer la semaine en cours. Tu peux aussi masquer ou afficher chaque semaine dans l'onglet Défis.</p>`:`<input id="pin" type="password" placeholder="PIN"><button class="g" id="ad">Activer</button>`}</div>`;
}
let pend = false;
function render(force){
  const a = document.activeElement;
  if (!force && a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.closest("#app")) { pend = true; return; }   // ne pas casser une saisie en cours
  pend = false;
  $("#app").innerHTML = ({feed:vFeed,rank:vRank,chal:vChal,me:vMe})[tab]();
  document.querySelectorAll("nav [data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  $("#status").innerHTML = `<span class="dot ${Store.live?"live":""}"></span>${Store.live?"Temps réel":"Mode démo"}`;
}
document.addEventListener("focusout", () => { if (pend) setTimeout(() => { if (pend) render(); }, 80); });

/* ============ INTERACTIONS ============ */
const needId = () => { alert("Pour liker ou commenter, renseigne ton prénom et vérifie ton département (PIN) dans Mon profil."); tab = "me"; render(true); scrollTo(0, 0); };
document.addEventListener("change", e => {
  if (e.target.id === "wcur") { const v = e.target.value; Store.setC(v); if (CONFIG.weeks.includes(v)) wsel = v; }
  if (e.target.id === "mt") { me = { ...me, name: ($("#mn") || {}).value ?? me.name, team: e.target.value }; render(true); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id && e.target.id.startsWith("ci-")) { const b = document.querySelector(`[data-csend="${CSS.escape(e.target.id.slice(3))}"]`); if (b) b.click(); }
});
document.addEventListener("click", e => {
  const wk = e.target.closest("[data-w]"); if (wk) { wsel = wk.dataset.w; render(true); }
  if (e.target.id === "help") showTour();
  const go = e.target.closest("[data-go]"); if (go) { tab = go.dataset.go; wsel = effCur() || wsel; render(true); scrollTo(0, 0); }
  if (e.target.closest("[data-wt]")) Store.setW(wsel, !wkVisible(wsel));
  if (e.target.closest("[data-wauto]")) Store.setW(wsel, null);
  const t = e.target.closest("[data-t]"); if (t) { tab = t.dataset.t; render(true); scrollTo(0,0); }
  const d = e.target.closest("[data-del]"); if (d && confirm("Supprimer ce post ?")) Store.del(d.dataset.del);
  const lk = e.target.closest("[data-like]"); if (lk) { if (!verified()) return needId(); const pid = lk.dataset.like; Store.setLike(pid, uKey(), !(likes[pid] || {})[uKey()]); }
  const cmb = e.target.closest("[data-cm]"); if (cmb) { const pid = cmb.dataset.cm; openCm.has(pid) ? openCm.delete(pid) : openCm.add(pid); render(true); }
  const cs = e.target.closest("[data-csend]"); if (cs) {
    const pid = cs.dataset.csend, inp = document.getElementById("ci-" + pid), text = inp ? inp.value.trim() : "";
    if (!verified()) return needId();
    if (text) { Store.addCm(pid, { author: me.name, team: me.team, text: text.slice(0, 200), ts: Date.now() }); inp.value = ""; render(true); const n = document.getElementById("ci-" + pid); if (n) n.focus(); }
  }
  const dc = e.target.closest("[data-dcm]"); if (dc && confirm("Supprimer ce commentaire ?")) Store.delCm(dc.dataset.dcm, dc.dataset.id);
  if (e.target.id === "sv") {
    const name = $("#mn").value.trim(), team = $("#mt").value;
    if (!name) return alert("Indique ton prénom.");
    if (!team) return alert("Choisis ton département.");
    if (me.verifiedTeam !== team) {
      const pin = $("#mtp")?.value.trim();
      if (pin !== String(CONFIG.teamPins[team])) return alert("PIN du département incorrect.");
      me = { name, team, verifiedTeam: team };
    } else me = { ...me, name, team };
    saveMe(); render(true);
  }
  if (e.target.id === "ad") { if ($("#pin").value === CONFIG.adminPin) { admin = true; render(true); } else alert("PIN incorrect"); }
  if (e.target.id === "add") openForm();
});
function openForm(){
  if (!avail().length) return alert("Aucun défi n'est ouvert pour le moment.");
  if (!verified()) { tab = "me"; render(true); scrollTo(0, 0); return alert("Renseigne ton prénom et vérifie ton département avec son PIN."); }
  const dlg = $("#dlg");
  dlg.innerHTML = `<h2 style="margin-bottom:14px">Déclarer un défi</h2>
  <label>Prénom</label><input id="fn" value="${esc(me.name||"")}">
  <label>Département</label><select id="ft" disabled>${CONFIG.teams.map(t=>`<option ${me.team===t?"selected":""}>${esc(t)}</option>`).join("")}</select>
  <label>Défi relevé</label><select id="fc">${Object.keys(ODD).filter(n=>avail().some(x=>x.sdg==n)).map(n=>`<optgroup label="ODD ${n} · ${esc(ODD[n])}">${avail().filter(x=>x.sdg==n).sort((a,b)=>LVO[a.lvl]-LVO[b.lvl]).map(x=>`<option value="${x.id}">${LV[x.lvl]} · ${ptsLabel(x)} · ${esc(x.t)}</option>`).join("")}</optgroup>`).join("")}</select>
  <div id="fq" hidden><label>Nombre de tranches de 2 €</label><input id="fqn" type="number" min="1" value="1"></div>
  <label>Description (optionnelle)</label><textarea id="fo" rows="2" placeholder="Raconte comment ça s'est passé… (une description du défi est ajoutée automatiquement)"></textarea>
  <label>Lien vers la preuve (photo, Drive, Insta…)</label><input id="fl" type="url" placeholder="https://">
  <div class="row sp"><button class="g" id="fx">Annuler</button><button class="p" id="fs">Publier</button></div>`;
  dlg.showModal();
  const sync = () => { $("#fq").hidden = !(ch($("#fc").value) || {}).unit; };
  $("#fc").onchange = sync; sync();
  $("#fx").onclick = () => dlg.close();
  $("#fs").onclick = async () => {
    const member = $("#fn").value.trim(), team = me.team, cid = $("#fc").value;
    if (!member) return alert("Indique ton prénom.");
    if (!verified()) return alert("Ton département doit être vérifié dans Mon profil.");
    if (!ch(cid).rep && posts.some(p => p.member.toLowerCase() === member.toLowerCase() && p.team === team && p.cid === cid)) return alert("Tu as déjà validé ce défi.");
    await Store.add({ member, team, cid, qty: +$("#fqn").value||1, note: $("#fo").value.trim().slice(0,300), link: $("#fl").value.trim(), ts: Date.now() });
    me = { ...me, name: member }; saveMe(); dlg.close(); tab = "feed"; render(true);
  };
}
/* ============ VISITE GUIDÉE ============ */
let tourOn = false;
function showTour(){
  if (tourOn) return; tourOn = true;
  const back = tab;
  const steps = [
    {t:"Bienvenue à la SDGs Cup 🌱", b:"<p>7 départements, 1 gagnant. Relève des défis liés aux ODD, poste ta preuve et fais gagner des points à ton département.</p><p>Petit tour rapide (30 secondes).</p>"},
    {sel:'[data-t="feed"]', view:"feed", t:"Le feed", b:"<p>Toutes les publications de tous les départements apparaissent ici, en direct. Tu peux liker ♥ et commenter chaque post.</p>"},
    {sel:'[data-t="chal"]', view:"chal", t:"Les défis", b:"<p>Les défis sont organisés par semaine (S1, S2, S3…), puis par ODD. Choisis la semaine avec les boutons en haut de la page.</p><p>Chaque défi indique les points qu'il rapporte.</p>"},
    {sel:'[data-t="me"]', view:"me", t:"Ton département", b:"<p>Dans <b>Mon profil</b>, entre ton prénom, choisis ton département et tape son PIN (demande-le à ton responsable de département).</p><p>Tu ne le fais qu'une fois : le site s'en souvient sur cet appareil.</p>"},
    {sel:"#add", t:"Déclarer un défi", b:"<p>Défi relevé ? Appuie sur le <b>+</b>, choisis le défi, ajoute un commentaire et un lien vers ta preuve (photo, Drive, Insta…).</p><p>Chaque membre poste sa propre preuve : chaque post rapporte des points à ton département.</p>"},
    {sel:'[data-t="rank"]', view:"rank", t:"Le classement", b:"<p>Suis en direct le classement des départements. Les organisateurs vérifient les posts et suppriment les fraudes.</p>"},
    {sel:"#help", t:"Besoin d'aide plus tard ?", b:"<p>Appuie sur ce « ? » à tout moment pour relancer le tour.</p>"}
  ];
  let i = 0, tm;
  const hole = document.createElement("div"); hole.className = "tour-hole none";
  const card = document.createElement("div"); card.className = "tour-card";
  const layer = document.createElement("div"); layer.className = "tour-layer"; layer.innerHTML = '<div class="tour-block"></div>';
  layer.append(hole, card);
  const end = () => { try { localStorage.setItem("sdgcup_tour", "1"); } catch (e) {} tourOn = false; clearInterval(tm); removeEventListener("resize", place); layer.remove(); tab = back === "me" ? "feed" : back; render(); scrollTo(0, 0); };
  function place(){
    const st = steps[i], el = st.sel ? document.querySelector(st.sel) : null, W = innerWidth, H = innerHeight, cw = Math.min(340, W - 24);
    if (!el){ hole.className = "tour-hole none"; Object.assign(card.style, {left:(W-cw)/2+"px", top:Math.max(16,(H-card.offsetHeight)/2)+"px", bottom:"auto"}); return; }
    const r = el.getBoundingClientRect(), p = 6;
    hole.className = "tour-hole";
    Object.assign(hole.style, {left:r.left-p+"px", top:r.top-p+"px", width:r.width+p*2+"px", height:r.height+p*2+"px", borderRadius:(r.width < 70 && Math.abs(r.width-r.height) < 12) ? "50%" : "16px"});
    const left = Math.min(Math.max(12, r.left + r.width/2 - cw/2), W - cw - 12);
    if (r.top + r.height/2 > H/2) Object.assign(card.style, {left:left+"px", top:"auto", bottom:H-r.top+16+"px"});
    else Object.assign(card.style, {left:left+"px", top:r.bottom+16+"px", bottom:"auto"});
  }
  function draw(){
    const st = steps[i], last = i === steps.length - 1;
    if (st.view && tab !== st.view){ tab = st.view; render(); scrollTo(0, 0); }
    card.innerHTML = `<div class="tc-top"><span class="mute">${i+1} / ${steps.length}</span>${last ? "" : '<button class="skip">Passer</button>'}</div><h3>${st.t}</h3>${st.b}<div class="tdots">${steps.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div><div class="row">${i ? '<button class="g back">Retour</button>' : ""}<button class="p next" style="flex:1">${last ? "C'est parti !" : i ? "Suivant" : "Démarrer le tour"}</button></div>`;
    const q = s => card.querySelector(s);
    if (q(".skip")) q(".skip").onclick = end;
    if (q(".back")) q(".back").onclick = () => { i--; draw(); };
    q(".next").onclick = () => { if (last) end(); else { i++; draw(); } };
    place();
  }
  document.body.append(layer); addEventListener("resize", place); tm = setInterval(place, 300); draw();
}
Store.sub(p => { posts = p; render(); });
Store.subL(v => { likes = v || {}; render(); });
Store.subM(v => { cms = v || {}; render(); });
Store.subW(w => { weeksOn = w || {}; render(); });
Store.subC(v => { curW = v || ""; render(); });
render();
try { if (!localStorage.getItem("sdgcup_tour")) setTimeout(showTour, 500); } catch (e) {}
let lastAuto = autoIdx(); setInterval(() => { const a = autoIdx(); if (a !== lastAuto) { lastAuto = a; render(); } }, 60000);
</script>
</body>
</html>
